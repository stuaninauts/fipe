name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: pip install uv==0.11.11
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      # Exit 5 = nenhum teste coletado (ainda não há pipeline); qualquer outra falha quebra o CI.
      - run: uv run pytest || test $? -eq 5
      - run: bash .claude/hooks/test-guard-bash.sh
